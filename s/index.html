<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Training · Video-Lab</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#0f1216;--muted:#6b7380;--line:#e3e6ea;--field:#f1f3f5;--red:#DA291C;--ok:#2fa36b;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d10;--card:#14181d;--ink:#eef2f6;--muted:#8f98a5;--line:#252b33;--field:#1b2026}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--red);display:grid;place-items:center}
.brand i svg{width:18px;height:18px}
.brand b{font-size:13px;letter-spacing:.02em}.brand b span{color:var(--red)}
.brand small{display:block;font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.brand .beta{margin-left:5px;padding:0 4px;border:1px solid currentColor;border-radius:4px;opacity:.7}
h1{margin:0 0 4px;font-size:clamp(22px,4.5vw,30px);letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px}
.ppl{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.ppl span{height:26px;padding:0 10px;border-radius:13px;background:var(--field);border:1px solid var(--line);font-size:13px;font-weight:600;display:inline-flex;align-items:center}
.ppl span.c{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 14px}
.left{font-size:13px;font-weight:650;color:var(--muted);margin-right:auto}
.left.warn{color:#d97706}
button,.btn{height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:650 14px inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
button.pri{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.v{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.v video{width:100%;aspect-ratio:16/9;background:#000;display:block;object-fit:contain}
.v.port video{aspect-ratio:9/16;max-height:62vh}
.v .m{display:flex;align-items:center;gap:8px;padding:10px 12px}
.v .m b{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v .m small{color:var(--muted);font-size:12px;white-space:nowrap}
.v .m a{width:34px;height:34px;padding:0;justify-content:center;border-radius:9px}
.v .m a svg{width:17px;height:17px}
.msg{margin:40px auto;max-width:460px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px}
.msg h2{margin:0 0 6px;font-size:20px}.msg p{margin:0;color:var(--muted)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.prog{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(10,13,18,.9);color:#fff;border-radius:14px;padding:10px 16px;font-size:13px;font-weight:650;min-width:260px;text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.prog i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-top:7px;overflow:hidden}
.prog i b{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
.note{font-size:12px;color:var(--muted);margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><i><svg viewBox="0 0 24 24" fill="#fff"><path d="M9 7.5v9l7.5-4.5z"/></svg></i><div><b><span>swiss</span>ski</b><small>Video-Lab<span class="beta">Beta</span></small></div></div>
  <div id="app"><p class="empty">Wird geladen …</p></div>
  <p class="note">Die Videos sind nur über diesen Link erreichbar und werden 3 Tage nach dem Training automatisch gelöscht. Wer sie behalten will, lädt sie vorher herunter.</p>
</div>
<script>
(function(){
var API=(function(){ try{ if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){ var o=localStorage.getItem('vlab:cloudApi'); if(o) return o; } }catch(e){} var a='https://vlab-cloud.swiss-ski-club.workers.dev'; return a.indexOf('%%')===0?'':a; })().replace(/\/+$/,'');
var id=(location.hash||'').replace(/^#/,'').trim(), M=null, $=function(s,r){ return (r||document).querySelector(s); }, app=$('#app');
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function mb(n){ return n>=1048576?(n/1048576).toFixed(n>=1e8?0:1)+' MB':Math.max(1,Math.round(n/1024))+' KB'; }
function vurl(v,dl){ return API+'/api/s/'+id+'/v/'+v.id+(dl?'?dl=1':''); }
function nice(n){ return String(n||'Video').replace(/\.[^.]+$/,'').replace(/_/g,' '); }
function left(){ var ms=M.exp-Date.now(); if(ms<=0) return 'abgelaufen'; var h=Math.floor(ms/36e5); return h>=1?'Noch '+h+' h verfügbar':'Noch '+Math.max(1,Math.round(ms/6e4))+' min verfügbar'; }
function gone(t,p){ app.innerHTML='<div class="msg"><h2>'+esc(t)+'</h2><p>'+esc(p)+'</p></div>'; document.title='Video-Lab'; }
function load(first){
  if(!API) return gone('Noch nicht eingerichtet','Die Cloud für Trainings-Videos ist noch nicht aktiv.');
  if(!/^[\w-]{20,40}$/.test(id)) return gone('Link unvollständig','Bitte den ganzen Link öffnen, so wie er verschickt wurde.');
  fetch(API+'/api/s/'+id,{cache:'no-store'}).then(function(r){ if(r.status===410||r.status===404){ gone('Link abgelaufen','Die Videos dieses Trainings sind nicht mehr verfügbar – sie werden nach 3 Tagen gelöscht.'); return null; } if(!r.ok) throw 0; return r.json(); })
  .then(function(j){ if(!j) return; if(!first&&M&&j.videos.length!==M.videos.length&&[].some.call(document.querySelectorAll('video'),function(v){ return !v.paused; })) return; /* läuft gerade ein Video: später neu zeichnen */ var n0=M?M.videos.length:-1; M=j; if(first||n0!==M.videos.length) render(); else $('.left').textContent=left(); })
  .catch(function(){ if(first) gone('Keine Verbindung','Bitte Internet prüfen und die Seite neu laden.'); });
}
function render(){
  document.title=(M.title||'Training')+' · Video-Lab';
  var sub=[M.place,M.date?M.date.split('-').reverse().join('.'):'',M.disc].filter(Boolean).join(' · ');
  var ppl=(M.athletes||[]).map(function(p){ return '<span>'+esc(p.n)+'</span>'; }).join('')+(M.coaches||[]).map(function(p){ return '<span class="c">Coach · '+esc(p.n)+'</span>'; }).join('');
  var auth=null; try{ auth=JSON.parse(localStorage.getItem('vlab:auth')||'null'); }catch(e){}
  var h='<h1>'+esc(M.title||'Training')+'</h1><div class="sub">'+esc(sub)+'</div>'+(ppl?'<div class="ppl">'+ppl+'</div>':'')+
    '<div class="bar"><span class="left'+(M.exp-Date.now()<12*36e5?' warn':'')+'">'+left()+'</span>'+
    (M.videos.length?'<button id="zip">'+ic('dl')+'Alle herunterladen (ZIP)</button>'+(auth&&auth.exp>Date.now()?'<button class="pri" id="lab">'+ic('lab')+'In Video-Lab übernehmen</button>':''):'')+'</div>';
  h+=M.videos.length?'<div class="grid">'+M.videos.map(function(v){ var port=v.h>v.w; return '<div class="v'+(port?' port':'')+'"><video controls playsinline preload="metadata" src="'+esc(vurl(v))+'#t=0.2"></video><div class="m"><b title="'+esc(nice(v.name))+'">'+esc(nice(v.name))+'</b><small>'+(v.dur?v.dur.toFixed(0)+' s · ':'')+mb(v.size)+'</small><a class="btn" href="'+esc(vurl(v,1))+'" download="'+esc(v.name)+'" aria-label="Herunterladen">'+ic('dl')+'</a></div></div>'; }).join('')+'</div>'
    :'<p class="empty">Noch keine Videos – sobald der Coach filmt, erscheinen sie hier automatisch.</p>';
  app.innerHTML=h;
  var z=$('#zip'); if(z) z.onclick=zip; var l=$('#lab'); if(l) l.onclick=toLab;
}
function ic(k){ return k==='dl'?'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>':'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z"/></svg>'; }
function prog(t,f){ var p=$('.prog'); if(t==null){ if(p) p.remove(); return; } if(!p){ p=document.createElement('div'); p.className='prog'; p.innerHTML='<span></span><i><b></b></i>'; document.body.appendChild(p); } $('span',p).textContent=t; $('b',p).style.width=Math.round((f||0)*100)+'%'; }
function getAll(each){ var vs=M.videos.slice(), tot=vs.reduce(function(s,v){ return s+v.size; },0)||1, done=0, out=[];
  return vs.reduce(function(pr,v,i){ return pr.then(function(){ return fetch(vurl(v),{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; var rd=r.body&&r.body.getReader?r.body.getReader():null, parts=[], got=0;
      if(!rd) return r.blob().then(function(b){ done+=v.size; each(i,vs.length,done/tot); return b; });
      function pump(){ return rd.read().then(function(x){ if(x.done) return new Blob(parts,{type:v.type||'video/mp4'}); parts.push(x.value); got+=x.value.length; each(i,vs.length,(done+got)/tot); return pump(); }); }
      return pump().then(function(b){ done+=v.size; return b; }); }).then(function(b){ out.push({v:v,b:b}); }); }); },Promise.resolve()).then(function(){ return out; }); }
/* ZIP ohne Kompression (Videos sind schon komprimiert) */
var CRC=(function(){ var t=new Uint32Array(256); for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc(u){ var c=0xFFFFFFFF; for(var i=0;i<u.length;i++) c=CRC[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipBlob(files){ var enc=new TextEncoder(), parts=[], cen=[], off=0, used={};
  files.forEach(function(f){ var nm=f.name, k=1; while(used[nm]) nm=f.name.replace(/(\.[^.]+)?$/,'_'+(++k)+'$1'); used[nm]=1; var n=enc.encode(nm), d=f.data, c=crc(d), h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint32(14,c,true); h.setUint32(18,d.length,true); h.setUint32(22,d.length,true); h.setUint16(26,n.length,true);
    parts.push(h.buffer,n,d); var e=new DataView(new ArrayBuffer(46)); e.setUint32(0,0x02014b50,true); e.setUint16(4,20,true); e.setUint16(6,20,true); e.setUint16(8,0x0800,true); e.setUint32(16,c,true); e.setUint32(20,d.length,true); e.setUint32(24,d.length,true); e.setUint16(28,n.length,true); e.setUint32(42,off,true);
    cen.push(e.buffer,n); off+=30+n.length+d.length; });
  var cs=cen.reduce(function(s,b){ return s+(b.byteLength||b.length); },0), end=new DataView(new ArrayBuffer(22)); end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,cs,true); end.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[end.buffer]),{type:'application/zip'}); }
function zip(){ var b=this; b.disabled=true;
  getAll(function(i,n,f){ prog('Video '+(i+1)+' von '+n+' wird geladen',f); }).then(function(L){ prog('ZIP wird erstellt',1);
    return Promise.all(L.map(function(x){ return x.b.arrayBuffer().then(function(a){ return {name:x.v.name,data:new Uint8Array(a)}; }); })); })
  .then(function(fs){ var z=zipBlob(fs), a=document.createElement('a'), nm=((M.title||'Training')+(M.date?'_'+M.date:'')).replace(/[^\wäöüÄÖÜ\-]+/g,'_')+'.zip'; a.href=URL.createObjectURL(z); a.download=nm; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); },60e3); prog(null); b.disabled=false; })
  .catch(function(){ prog(null); b.disabled=false; alert('Herunterladen fehlgeschlagen. Bitte Internet prüfen und nochmals versuchen.'); }); }
/* In Video-Lab übernehmen: gleiche Adresse → Datenbank vlab-cloud, Video-Lab zeigt sie in der Liste */
function toLab(){ var b=this; b.disabled=true;
  getAll(function(i,n,f){ prog('Video '+(i+1)+' von '+n+' wird übernommen',f); }).then(function(L){ return new Promise(function(res,rej){ var r=indexedDB.open('vlab-cloud',1); r.onupgradeneeded=function(){ r.result.createObjectStore('clips',{keyPath:'id'}); }; r.onerror=function(){ rej(r.error); };
      r.onsuccess=function(){ var db=r.result, tx=db.transaction('clips','readwrite'), st=tx.objectStore('clips'); L.forEach(function(x){ st.put({id:id+'/'+x.v.id,name:x.v.name,blob:x.b,t:x.v.t,s:id,title:M.title}); }); tx.oncomplete=function(){ db.close(); res(); }; tx.onerror=function(){ rej(tx.error); }; }; }); })
  .then(function(){ prog(null); try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){} location.href='../'; })
  .catch(function(){ prog(null); b.disabled=false; alert('Übernehmen fehlgeschlagen – zu wenig Speicher oder kein Netz.'); }); }
load(true); setInterval(function(){ if(M&&!document.hidden) load(false); },20e3);
addEventListener('hashchange',function(){ id=(location.hash||'').replace(/^#/,''); M=null; load(true); });
})();
</script>
</body>
</html>
