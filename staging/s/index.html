<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0d10">
<title>Training · Video-Lab</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#0f1216;--muted:#687180;--line:#e2e5ea;--field:#eef0f3;--red:#DA291C;--ok:#2fa36b;--shadow:0 1px 2px rgba(15,18,22,.05),0 10px 30px -18px rgba(15,18,22,.25);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d10;--card:#14181d;--ink:#eef2f6;--muted:#8f98a5;--line:#242a32;--field:#1a1f25;--shadow:0 12px 30px -18px rgba(0,0,0,.8)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
.hero{background:linear-gradient(160deg,#1b0f0e 0%,#0b0d10 55%,#0b0d10 100%);color:#fff;padding:max(18px,env(safe-area-inset-top)) 0 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-140px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(218,41,28,.45),transparent 65%);pointer-events:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;position:relative;z-index:1}
.brand i{width:32px;height:32px;border-radius:9px;background:var(--red);display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(218,41,28,.9)}
.brand i svg{width:18px;height:18px}
.brand b{font-size:14px;letter-spacing:.01em}.brand b span{color:#ff5a4c;font-style:italic}
.brand small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.6);text-transform:uppercase}
.brand .beta{margin-left:6px;padding:0 4px;border:1px solid currentColor;border-radius:4px}
.lang{margin-left:auto;display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:9px;padding:2px}
.lang button{height:26px;min-width:34px;border:0;border-radius:7px;background:transparent;color:rgba(255,255,255,.7);font:700 11.5px inherit;font-family:inherit;cursor:pointer}
.lang button.on{background:#fff;color:#111}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,34px);line-height:1.1;letter-spacing:-.02em;position:relative;z-index:1}
.sub{color:rgba(255,255,255,.72);font-size:14px;position:relative;z-index:1}
.left{display:inline-flex;align-items:center;gap:6px;margin-top:12px;height:26px;padding:0 10px;border-radius:13px;background:rgba(255,255,255,.1);font-size:12.5px;font-weight:650;position:relative;z-index:1}
.left::before{content:"";width:7px;height:7px;border-radius:50%;background:#3ddc84}
.left.warn::before{background:#f5a524}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:650 13px inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip em{font-style:normal;font-weight:600;color:var(--muted);font-size:12px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip.on em{color:inherit;opacity:.7}
.coach{height:34px;padding:0 11px;border-radius:17px;display:inline-flex;align-items:center;font-size:12.5px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
button.b{height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:650 14px inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
button.b.pri{background:var(--red);border-color:var(--red);color:#fff}
button.b:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.v{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.v .pv{position:relative;aspect-ratio:16/10;background:#000;cursor:pointer}
.v.port .pv{aspect-ratio:4/5}
.v .pv img,.v .pv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.v .pv video{object-fit:contain}
.v .pv .play{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(10,13,18,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.3)}
.v .pv .play svg{width:22px;height:22px;margin-left:3px}
.v .pv .dur{position:absolute;right:8px;bottom:8px;padding:2px 7px;border-radius:7px;background:rgba(0,0,0,.6);color:#fff;font:650 11.5px inherit;font-variant-numeric:tabular-nums}
.v .pv .new{position:absolute;left:8px;top:8px;padding:3px 8px;border-radius:8px;background:var(--red);color:#fff;font:800 10.5px inherit;letter-spacing:.06em;text-transform:uppercase}
.v .m{display:flex;align-items:center;gap:8px;padding:10px 12px}
.v .m .tx{flex:1;min-width:0}
.v .m b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v .m small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v .m a{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);flex:none}
.v .m a svg{width:17px;height:17px}
.msg{margin:48px auto;max-width:460px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 22px;box-shadow:var(--shadow)}
.msg h2{margin:0 0 6px;font-size:20px}.msg p{margin:0;color:var(--muted)}
.empty{color:var(--muted);padding:34px 0;text-align:center}
.prog{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(10,13,18,.92);color:#fff;border-radius:14px;padding:11px 16px;font-size:13px;font-weight:650;min-width:270px;text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);z-index:9}
.prog i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-top:7px;overflow:hidden}
.prog i b{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
.note{font-size:12px;color:var(--muted);margin:26px 0 30px}
main.wrap{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
@media (max-width:560px){ .grid{grid-template-columns:1fr 1fr;gap:10px} .v .m{padding:8px 9px} .v .m b{font-size:13px} .v .m a{width:32px;height:32px} .acts{width:100%} .acts button.b{flex:1;justify-content:center;padding:0 10px;font-size:13px} }
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="brand"><i><svg viewBox="0 0 24 24" fill="#fff"><path d="M9 7.5v9l7.5-4.5z"/></svg></i><div><b><span>swiss</span>ski</b><small>Video-Lab<span class="beta">Beta</span></small></div>
    <div class="lang"><button data-l="de">DE</button><button data-l="fr">FR</button></div></div>
  <div id="hd"><h1>&nbsp;</h1></div>
</div></header>
<main class="wrap"><div id="app"><p class="empty" data-t="load"></p></div><p class="note" data-t="note"></p></main>

function fname(x){ return x.v.p?x.v.p.replace(/[^\wäöüÄÖÜéèàç\- ]+/g,'').trim().replace(/\s+/g,'_')+'_'+x.v.name:x.v.name; }

  getAll(function(i,n,f){ prog(t('ld',{i:i+1,n:n}),f); }).then(function(L){ prog(t('mk'),1);
